[package]
name = "solana_vanity"
version = "0.1.0"
edition = "2021"

[dependencies]
rand = { version = "0.7", features = ["small_rng"] }
rand_chacha = "0.2"
ed25519-dalek = { version = "1.0.1", features = ["std"] }
bs58 = "0.5"
hex = "0.4"
num_cpus = "1.13"
chrono = { version = "0.4", features = ["clock"] }
clap = { version = "4.5", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
